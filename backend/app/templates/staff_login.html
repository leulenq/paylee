{% extends "base.html" %}
{% block title %}Staff sign-in · Paylee{% endblock %}
{% block content %}
<h1>Staff sign-in</h1>
<p class="lede">Use your individual operations account and authenticator.</p>
{% if error %}<p class="notice" role="alert">{{ error }}</p>{% endif %}
<form method="post" action="/admin/login">
  <label for="username">Username</label><input id="username" name="username" autocomplete="username" required maxlength="100">
  <label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="200">
  <label for="code">Authenticator code</label><input id="code" name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6">
  <p><button>Sign in</button></p>
</form>
{% endblock %}
