[project]
name = "swipebills-backend"
version = "0.1.0"
description = "API, intake form, and admin for SwipeBills"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "jinja2>=3.1",
    "pyjwt[crypto]>=2.9",
    "stripe>=10.0",
    "httpx[http2]>=0.27",
    "cryptography>=43.0",
    "boto3>=1.35",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.17.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
